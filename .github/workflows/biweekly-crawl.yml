name: biweekly-crawl
on:
  schedule:
    - cron: "0 1 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper/crawl.py --fresh
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: biweekly policy crawl"
          file_pattern: web/data/*.json
      # Pushing web/data/*.json triggers deploy-pages.yml on the default branch.
